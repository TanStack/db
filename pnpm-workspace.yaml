cleanupUnusedCatalogs: true
linkWorkspacePackages: true
preferWorkspacePackages: true
blockExoticSubdeps: false

# @solidjs/vite-plugin dedupes solid-js to the importing project, so rollup
# resolves solid-js's own imports from each project's node_modules; hoist the
# signals package to keep it resolvable there.
publicHoistPattern:
  - '@solidjs/signals'

packages:
  - packages/**
  - examples/**/*

overrides:
  # Newest @solidjs/vite-plugin builds (next.32+) require Vite 8; this repo's
  # vitest 3.2.4 resolves Vite 7. Pin the newest Vite-7-compatible build.
  '@solidjs/vite-plugin': 3.0.0-next.31
  metro: '0.82.5'
  metro-babel-transformer: '0.82.5'
  metro-cache: '0.82.5'
  metro-cache-key: '0.82.5'
  metro-config: '0.82.5'
  metro-core: '0.82.5'
  metro-file-map: '0.82.5'
  metro-minify-terser: '0.82.5'
  metro-resolver: '0.82.5'
  metro-runtime: '0.82.5'
  metro-source-map: '0.82.5'
  metro-symbolicate: '0.82.5'
  metro-transform-plugins: '0.82.5'
  metro-transform-worker: '0.82.5'

allowBuilds:
  better-sqlite3: true
  electron: true

  '@firebase/util': false
  '@journeyapps/wa-sqlite': false
  '@parcel/watcher': false

  esbuild: false
  lmdb: false
  msgpackr-extract: false
  protobufjs: false
  rxdb: false
  sharp: false
  unrs-resolver: false
  workerd: false
