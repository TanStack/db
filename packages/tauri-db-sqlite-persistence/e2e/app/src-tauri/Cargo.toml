[package]
name = "tauri-db-sqlite-persistence-e2e-app"
version = "0.0.0"
description = "Repo-local Tauri e2e harness for TanStack DB SQLite persistence"
authors = ["TanStack Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
